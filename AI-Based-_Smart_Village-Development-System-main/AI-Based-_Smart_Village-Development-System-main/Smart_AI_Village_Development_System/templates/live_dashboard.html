<!DOCTYPE html>
<html>

<head>
<title>Live Dashboard</title>

<style>

body{
font-family:Arial;
background:#f2f7f2;
}

.box{
background:white;
padding:25px;
margin:30px;
border-radius:15px;
text-align:center;
box-shadow:0px 0px 10px grey;
}

.card{
display:inline-block;
width:200px;
padding:20px;
margin:10px;
background:#dff0d8;
border-radius:10px;
}

</style>

</head>

<body>

<div class="box">

<h1>📊 Live Village Statistics</h1>


<div class="card">
<h2>{{total}}</h2>
<p>Total Villages</p>
</div>


<div class="card">
<h2>{{rainfall}}</h2>
<p>Average Rainfall</p>
</div>


<div class="card">
<h2>{{employment}}</h2>
<p>Employment</p>
</div>


<div class="card">
<h2>{{hospitals}}</h2>
<p>Hospitals</p>
</div>

<div class="card">
<h2>{{score}}</h2>
<p>Development Score</p>

</div>

</body>
</html>
